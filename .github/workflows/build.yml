name: Compilar APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar
        id: build
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Preparar APK
        if: success()
        run: cp app/build/outputs/apk/release/app-release.apk ThopoBupi_Campo.apk

      - name: Publicar versão
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: ThopoBupi Campo 1.0.${{ github.run_number }}
          body: APK para a caderneta UniStrong P9IV. Descarregar ThopoBupi_Campo.apk e instalar.
          files: ThopoBupi_Campo.apk
          make_latest: true

      - name: Guardar registo da compilação
        if: always()
        run: |
          git config user.name "build-bot"
          git config user.email "build-bot@users.noreply.github.com"
          cp build.log /tmp/build.log 2>/dev/null || echo "sem registo" > /tmp/build.log
          echo "${{ job.status }} run=${{ github.run_number }} sha=${{ github.sha }}" > /tmp/status.txt
          git checkout --orphan build-log
          git rm -rf . > /dev/null 2>&1 || true
          rm -rf ./* .gitignore .github 2>/dev/null || true
          cp /tmp/build.log /tmp/status.txt .
          git add build.log status.txt
          git commit -m "registo da compilação ${{ github.run_number }}"
          git push -f origin build-log
